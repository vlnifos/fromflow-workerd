# Builds workerd + our patches for Linux arm64 (the sites VPS) and publishes it as a
# GitHub release. The same toolchain image and script as a local build (Dockerfile,
# build-in-container.sh), so the binary matches what the sites-host stand checks; the
# stand's x86_64 binary is built locally (build.sh), not here.
#
# Runs when VERSION or a patch changes on main, or by hand (Actions → build workerd →
# Run workflow). The release tag is <VERSION>-ff.<hash of the patches>: the same
# version + patches is never built twice unless run by hand with `force`.
#
# Free standard runners of a public repository: 4 cores, 16 GB RAM, job limit 6 h.
# Bazel's disk cache is kept in the Actions cache per workerd version: the first build
# of a version compiles V8 (~70 min), a later patch change recompiles only what it
# touches. A new VERSION starts from the previous version's cache.
name: build workerd

on:
  push:
    branches: [main]
    paths: [VERSION, 'patches/**', Dockerfile, build-in-container.sh, .github/workflows/build.yml]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the release exists
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
        run: |
          version=$(cat VERSION)
          hash=$(cat patches/*.patch | sha256sum | cut -c1-8)
          tag="$version-ff.$hash"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != true ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "release $tag exists — nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    env:
      ARCH: arm64
    steps:
      - uses: actions/checkout@v4

      # The V8 build with Bazel's output needs more than the runner's free disk:
      # drop preinstalled SDKs we do not use, then build on the larger of / and /mnt.
      - name: Free disk
        run: |
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/lib/jvm /opt/microsoft /opt/google || true
          docker system prune -af > /dev/null || true
          root=$(df --output=avail -B1 / | tail -1)
          mnt=$(df --output=avail -B1 /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt:-0}" -gt "$root" ]; then work=/mnt/workerd; else work=$HOME/workerd; fi
          sudo mkdir -p "$work/src" "$work/cache" "$work/out"
          echo "WORK=$work" >> "$GITHUB_ENV"
          df -h / /mnt 2>/dev/null || df -h /

      - name: Toolchain image
        run: docker build -q -t workerd-toolchain .

      # Only Bazel's disk cache (action outputs), not its whole output base: that one is
      # tens of GB, over the Actions cache limit (10 GB per repository).
      - name: Restore Bazel disk cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.WORK }}/cache/bazel-disk
          key: bazel-disk-${{ env.ARCH }}-${{ needs.plan.outputs.tag }}
          restore-keys: |
            bazel-disk-${{ env.ARCH }}-${{ needs.plan.outputs.version }}-
            bazel-disk-${{ env.ARCH }}-

      - name: Build
        id: build
        run: |
          started=$(date +%s)
          sudo du -sh "$WORK/cache/bazel-disk" 2>/dev/null || echo "no Bazel disk cache: full build"
          # Before the build: a failed or timed-out build still saves what it compiled.
          echo "started=true" >> "$GITHUB_OUTPUT"
          docker run --rm \
            -v "$WORK/src:/workerd" \
            -v "$WORK/cache:/root/.cache" \
            -v "$PWD/patches:/patches:ro" \
            -v "$WORK/out:/out" \
            workerd-toolchain build-workerd "${{ needs.plan.outputs.version }}" --strip=always \
              --disk_cache=/root/.cache/bazel-disk
          echo "built in $(( ($(date +%s) - started) / 60 )) min"
          sudo du -sh "$WORK/src" "$WORK/cache" "$WORK/cache/bazel-disk" || true
          df -h / /mnt 2>/dev/null || df -h /

      # The container writes as root; the cache step reads as the runner user.
      - name: Own Bazel disk cache
        if: always() && steps.build.outputs.started == 'true'
        run: sudo chown -R "$(id -u):$(id -g)" "$WORK/cache/bazel-disk" && du -sh "$WORK/cache/bazel-disk"

      # Saved even when the build fails: the next run resumes from it.
      - name: Save Bazel disk cache
        if: always() && steps.build.outputs.started == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.WORK }}/cache/bazel-disk
          key: bazel-disk-${{ env.ARCH }}-${{ needs.plan.outputs.tag }}

      - name: Package
        run: |
          name=workerd-linux-$ARCH
          sudo cp "$WORK/out/workerd" "$name"
          sudo chown "$(id -u)" "$name"
          file "$name"
          gzip -9 "$name"
          sha256sum "$name.gz" > "$name.gz.sha256"
          cat "$name.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: workerd-linux-${{ env.ARCH }}
          path: workerd-linux-${{ env.ARCH }}.gz*
          retention-days: 7

  release:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -la dist
          notes="workerd $VERSION (cloudflare/workerd) + patches/ at $GITHUB_SHA.

          $(cat dist/*.sha256)"
          gh release delete "$TAG" --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create "$TAG" dist/* --title "$TAG" --notes "$notes"
